# Local stack: API + PostgreSQL 16 with Row-Level Security.
# Migrations in db/migrations run automatically on the FIRST start of an empty volume
# (docker-entrypoint-initdb.d). Reset with: docker compose down -v
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: llm_gateway
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_dev_password}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-gateway_app_dev_password}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d llm_gateway"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 3000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PERSISTENCE: postgres
      # Connects as the non-superuser runtime role so RLS is enforced.
      DATABASE_URL: postgres://gateway_app:${APP_DB_PASSWORD:-gateway_app_dev_password}@postgres:5432/llm_gateway
      ADMIN_API_KEY: ${ADMIN_API_KEY:?Set ADMIN_API_KEY in .env (see .env.example)}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-}
      ENABLE_MOCK_PROVIDER: ${ENABLE_MOCK_PROVIDER:-true}
    ports:
      - "${API_HOST_PORT:-3000}:3000"

volumes:
  pgdata:
